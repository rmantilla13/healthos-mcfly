# Regenerate the Xcode project after editing this file: `xcodegen generate` (brew install xcodegen).
name: HealthOSSync
options:
  bundleIdPrefix: health.mcfly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "24"
targets:
  HealthOSSync:
    type: application
    platform: iOS
    sources:
      - path: HealthOSSync
        excludes:
          - Info.plist
          - HealthOSSync.entitlements
    info:
      path: HealthOSSync/Info.plist
      properties:
        CFBundleDisplayName: healthOS
        # From the build settings above, so testflight.sh's bump reaches the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: healthOS reads your Health data and sends daily summaries to your healthOS dashboard.
        NSHealthUpdateUsageDescription: healthOS saves the food and drink you log in healthOS to Apple Health.
        NSCameraUsageDescription: healthOS uses the camera to scan food barcodes, photograph a meal to estimate it, take a reference photo for your portrait, and photograph a paper lab report to read its results. A meal photo is used for that estimate only; reference photos and lab reports are kept in your healthOS account until you delete them.
        NSMicrophoneUsageDescription: healthOS uses the microphone only while you hold to record a voice note about what you ate. The recording is sent once to be turned into words, and healthOS never stores or logs it.
        NSLocalNetworkUsageDescription: healthOS can send your Health data to a healthOS server on your local network.
        NSBluetoothAlwaysUsageDescription: healthOS connects to your WHOOP's Heart Rate Broadcast (or another Bluetooth heart rate sensor) to show your heart rate live while that screen is open.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only HTTPS via URLSession: exempt from export compliance documentation.
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [healthkit]
        # The app refresh backstop for background sync (Background.refreshTask).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [health.mcfly.sync.refresh]
        # DM Sans, the web's face (Fonts/, with its OFL licence). Resources are copied flat into the bundle.
        UIAppFonts: [DMSans-Variable.ttf]
    entitlements:
      path: HealthOSSync/HealthOSSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.mcfly.sync
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 92X9CP6C6D
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: [HealthOSSyncTests]
  HealthOSSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HealthOSSyncTests]
    dependencies:
      - target: HealthOSSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: health.mcfly.sync.tests
        DEVELOPMENT_TEAM: 92X9CP6C6D
